# Local datasets. `benchmark_only: true` entries are only offered in offline runs
# (benchmarks), so they never replace real web sourcing in online runs.
datasets:
  - name: diabetes
    file: diabetes.csv
    benchmark_only: true
    rows: 442
    description: >
      Diabetes progression (Efron et al., 2004): 10 baseline measurements of 442 patients (age, sex, bmi,
      blood pressure bp, six blood serum measurements s1–s6) and a quantitative measure of disease progression
      one year after baseline (`disease_progression`). One row per patient; `patient_id` identifies the row.
    columns: [patient_id, age, sex, bmi, bp, s1, s2, s3, s4, s5, s6, disease_progression]
    license: BSD-3-Clause (as distributed with scikit-learn, sklearn.datasets.load_diabetes)
    license_url: https://github.com/scikit-learn/scikit-learn/blob/main/COPYING
    source_url: https://scikit-learn.org/stable/datasets/toy_dataset.html#diabetes-dataset
    notes: exported with sklearn.datasets.load_diabetes(scaled=False); original data by Efron, Hastie, Johnstone & Tibshirani (2004)

  - name: breast_cancer
    file: breast_cancer.csv
    benchmark_only: true
    rows: 569
    description: >
      Breast Cancer Wisconsin (Diagnostic): 30 numeric features computed from digitized images of fine needle
      aspirates of breast masses; label `diagnosis` (benign / malignant). One row per sample (`sample_id`).
    columns: [sample_id, "30 numeric features", diagnosis]
    license: CC BY 4.0 (UCI Machine Learning Repository; also distributed with scikit-learn)
    license_url: https://archive.ics.uci.edu/dataset/17/breast+cancer+wisconsin+diagnostic
    source_url: https://archive.ics.uci.edu/dataset/17/breast+cancer+wisconsin+diagnostic
    notes: exported with sklearn.datasets.load_breast_cancer(); label mapped to benign/malignant

  - name: synthetic_rentals
    file: synthetic_rentals.csv
    benchmark_only: true
    rows: 3060
    description: >
      Synthetic rental listings for the fictional city "Lakeside" (12 districts) generated by
      benchmarks/make_datasets.py for offline benchmarking. Contains realistic messiness: duplicated listings,
      missing construction years, sentinel values, mixed area units, and a few rents with unit errors.
    columns: [listing_id, district, latitude, longitude, rooms, living_area, year_built, floor, has_balcony,
              has_elevator, monthly_rent_chf]
    license: CC0 1.0 (synthetic, generated in this project)
    license_url: https://creativecommons.org/publicdomain/zero/1.0/
    source_url: local://datasets/synthetic_rentals.csv
